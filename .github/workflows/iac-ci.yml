name: CI - Infrastructure

# Infrastructure pipeline: validates and scans the Terraform code.
# It runs ONLY when something under infra/ (or this file) changes.
# It needs no secrets, no registry access and no cloud credentials: read-only.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/iac-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/iac-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IAC_DIR: infra/terraform
  # "false" = the infrastructure scans only report. Set to "true" to make them block the pipeline.
  IAC_GATE: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  iac-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Terraform init (no backend, no credentials) and validate
        run: |
          TF="docker run --rm -v $PWD/${IAC_DIR}:/work -w /work hashicorp/terraform:1.12"
          $TF init -backend=false -input=false
          $TF validate

  iac-checkov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov (exact version)
        run: pip install "checkov==3.4.6"
      - name: Checkov scan
        id: checkov
        run: |
          mkdir -p reports
          set +e
          checkov -d "$IAC_DIR" --framework terraform --quiet --compact --output cli --output json --output-file-path reports
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show the report in the log
        if: always()
        run: cat reports/results_cli.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report-${{ github.sha }}
          retention-days: 30
          path: reports
      - name: Gate (fails when a check fails and the gate is enabled)
        if: env.IAC_GATE == 'true' && steps.checkov.outputs.rc != '0'
        run: |
          echo "::error::Checkov reported failed checks"
          exit 1

  iac-trivy-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC report (all severities, never fails)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: ${{ env.IAC_DIR }}
          format: table
          output: trivy-iac-report.txt
          exit-code: "0"
      - name: Show the report in the log
        if: always()
        run: cat trivy-iac-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-iac-report-${{ github.sha }}
          retention-days: 30
          path: trivy-iac-report.txt

  # Separate job = fresh machine (same reason as the dependency gate).
  iac-trivy-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC gate (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: ${{ env.IAC_DIR }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: ${{ env.IAC_GATE == 'true' && '1' || '0' }}

  # tfsec is deprecated (merged into Trivy). It runs here only for the comparison.
  # The binary is pinned by version AND by SHA-256 checksum.
  iac-tfsec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tfsec 1.28.13 (checksum verified)
        run: |
          curl -sSfL -o tfsec.tar.gz https://github.com/aquasecurity/tfsec/releases/download/v1.28.13/tfsec_1.28.13_linux_amd64.tar.gz
          echo "f643c390e6eabdf4bd64e807ff63abfe977d4f027c0b535eefe7a5c9f391fc28  tfsec.tar.gz" | sha256sum -c -
          tar -xzf tfsec.tar.gz tfsec
      - name: tfsec scan
        id: tfsec
        run: |
          mkdir -p reports
          set +e
          ./tfsec "$IAC_DIR" --no-colour > reports/tfsec-report.txt 2>&1
          ./tfsec "$IAC_DIR" --no-colour --minimum-severity HIGH > /dev/null 2>&1
          echo "rc_high=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show the report in the log
        if: always()
        run: cat reports/tfsec-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfsec-report-${{ github.sha }}
          retention-days: 30
          path: reports
      - name: Gate (fails on HIGH or above when the gate is enabled)
        if: env.IAC_GATE == 'true' && steps.tfsec.outputs.rc_high != '0'
        run: |
          echo "::error::tfsec reported HIGH or CRITICAL findings"
          exit 1
