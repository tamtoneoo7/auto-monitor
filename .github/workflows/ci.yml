name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can only read the repository content.
permissions:
  contents: read

env:
  IAC_DIR: infra/terraform
  # "false" = the infrastructure scans only report. Set to "true" to make them block the pipeline.
  IAC_GATE: "true"

# A new run on the same branch cancels the previous one (no two runs fight each other).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Stage 1: VALIDATE
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Required files are present
        run: |
          for svc in agent backend frontend ws-gateway; do
            test -f "$svc/Dockerfile" || { echo "::error::Missing Dockerfile: $svc"; exit 1; }
          done
          test -f docker-compose.yml || { echo "::error::Missing docker-compose.yml"; exit 1; }
          test -f .env.example || { echo "::error::Missing .env.example"; exit 1; }
      - name: No .env file is tracked by Git
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by Git"; exit 1
          fi
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q

  # ---------------------------------------------------------------- Stage 2: TEST
  test-agent:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt pytest-cov
      - name: Run tests
        working-directory: agent
        run: pytest --junitxml=junit-agent.xml --cov=. --cov-report=xml:coverage.xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-agent
          path: |
            agent/junit-agent.xml
            agent/coverage.xml

  test-backend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests with JaCoCo
        working-directory: backend
        run: mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.12:report
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-backend
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/site/jacoco/jacoco.xml

  test-ws-gateway:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ws-gateway/package-lock.json
      - name: Install dependencies
        working-directory: ws-gateway
        run: |
          npm ci
          npm install --no-save @vitest/coverage-v8@2.1.9
      - name: Run tests
        working-directory: ws-gateway
        run: npx vitest run --reporter=junit --outputFile=junit.xml --coverage --coverage.provider=v8 --coverage.reporter=lcov
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-ws-gateway
          path: |
            ws-gateway/junit.xml
            ws-gateway/coverage/lcov.info

  test-frontend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  # ---------------------------------------------------------------- Stage 2b: SECURITY SCAN
  # security-scan: full report, never fails.  security-gate (below): fails on CRITICAL,
  # or on HIGH when a fixed version exists.
  security-scan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Trivy's own action was compromised in March 2026 (tags were rewritten).
      # So it is pinned to the full commit of the safe release 0.35.0, and the Trivy binary to v0.69.3.
      - name: Trivy report (all severities, never fails)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          output: trivy-report.txt
          exit-code: "0"
      - name: Show the report in the log
        if: always()
        run: cat trivy-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ github.sha }}
          retention-days: 30
          path: trivy-report.txt

  # Separate job = fresh machine, so nothing left over from the report scan can change the result.
  security-gate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy gate (fails on CRITICAL, or HIGH with an available fix)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # ---------------------------------------------------------------- Stage 2c: INFRASTRUCTURE AS CODE
  iac-validate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Terraform init (no backend, no credentials) and validate
        run: |
          TF="docker run --rm -v $PWD/${IAC_DIR}:/work -w /work hashicorp/terraform:1.12"
          $TF init -backend=false -input=false
          $TF validate

  iac-checkov:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov (exact version)
        run: pip install "checkov==3.4.6"
      - name: Checkov scan
        id: checkov
        run: |
          mkdir -p reports
          set +e
          checkov -d "$IAC_DIR" --framework terraform --quiet --compact --output cli --output json --output-file-path reports
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show the report in the log
        if: always()
        run: cat reports/results_cli.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkov-report-${{ github.sha }}
          retention-days: 30
          path: reports
      - name: Gate (fails when a check fails and the gate is enabled)
        if: env.IAC_GATE == 'true' && steps.checkov.outputs.rc != '0'
        run: |
          echo "::error::Checkov reported failed checks"
          exit 1

  iac-trivy-report:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC report (all severities, never fails)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: ${{ env.IAC_DIR }}
          format: table
          output: trivy-iac-report.txt
          exit-code: "0"
      - name: Show the report in the log
        if: always()
        run: cat trivy-iac-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-iac-report-${{ github.sha }}
          retention-days: 30
          path: trivy-iac-report.txt

  # Separate job = fresh machine (same reason as the dependency gate).
  iac-trivy-gate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC gate (HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: ${{ env.IAC_DIR }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: ${{ env.IAC_GATE == 'true' && '1' || '0' }}

  # tfsec is deprecated (merged into Trivy). It runs here only for the comparison.
  # The binary is pinned by version AND by SHA-256 checksum.
  iac-tfsec:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tfsec 1.28.13 (checksum verified)
        run: |
          curl -sSfL -o tfsec.tar.gz https://github.com/aquasecurity/tfsec/releases/download/v1.28.13/tfsec_1.28.13_linux_amd64.tar.gz
          echo "f643c390e6eabdf4bd64e807ff63abfe977d4f027c0b535eefe7a5c9f391fc28  tfsec.tar.gz" | sha256sum -c -
          tar -xzf tfsec.tar.gz tfsec
      - name: tfsec scan
        id: tfsec
        run: |
          mkdir -p reports
          set +e
          ./tfsec "$IAC_DIR" --no-colour > reports/tfsec-report.txt 2>&1
          ./tfsec "$IAC_DIR" --no-colour --minimum-severity HIGH > /dev/null 2>&1
          echo "rc_high=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show the report in the log
        if: always()
        run: cat reports/tfsec-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfsec-report-${{ github.sha }}
          retention-days: 30
          path: reports
      - name: Gate (fails on HIGH or above when the gate is enabled)
        if: env.IAC_GATE == 'true' && steps.tfsec.outputs.rc_high != '0'
        run: |
          echo "::error::tfsec reported HIGH or CRITICAL findings"
          exit 1

  # ---------------------------------------------------------------- Stage 3: BUILD
  build:
    needs: [test-agent, test-backend, test-ws-gateway, test-frontend, security-scan, security-gate, iac-validate, iac-checkov, iac-trivy-gate, iac-tfsec]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ws-gateway/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build backend (jar)
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Build ws-gateway
        working-directory: ws-gateway
        run: |
          npm ci
          npm run build
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check agent code compiles
        working-directory: agent
        run: |
          pip install -r requirements.txt
          python -m compileall app
      - uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          retention-days: 7
          path: |
            backend/target/*.jar
            ws-gateway/dist

  # ---------------------------------------------------------------- Stage 4: PACKAGE
  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        service: [agent, backend, frontend, ws-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image monitor-${{ matrix.service }} (local only, not pushed)
        run: docker build -t "monitor-${{ matrix.service }}:${{ github.sha }}" "${{ matrix.service }}"
