name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can only read the repository content.
permissions:
  contents: read

# A new run on the same branch cancels the previous one (no two runs fight each other).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Stage 1: VALIDATE
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Required files are present
        run: |
          for svc in agent backend frontend ws-gateway; do
            test -f "$svc/Dockerfile" || { echo "::error::Missing Dockerfile: $svc"; exit 1; }
          done
          test -f docker-compose.yml || { echo "::error::Missing docker-compose.yml"; exit 1; }
          test -f .env.example || { echo "::error::Missing .env.example"; exit 1; }
      - name: No .env file is tracked by Git
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by Git"; exit 1
          fi
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q

  # ---------------------------------------------------------------- Stage 2: TEST
  test-agent:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt pytest-cov
      - name: Run tests
        working-directory: agent
        run: pytest --junitxml=junit-agent.xml --cov=. --cov-report=xml:coverage.xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-agent
          path: |
            agent/junit-agent.xml
            agent/coverage.xml

  test-backend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests with JaCoCo
        working-directory: backend
        run: mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.12:report
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-backend
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/site/jacoco/jacoco.xml

  test-ws-gateway:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ws-gateway/package-lock.json
      - name: Install dependencies
        working-directory: ws-gateway
        run: |
          npm ci
          npm install --no-save @vitest/coverage-v8@2.1.9
      - name: Run tests
        working-directory: ws-gateway
        run: npx vitest run --reporter=junit --outputFile=junit.xml --coverage --coverage.provider=v8 --coverage.reporter=lcov
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-ws-gateway
          path: |
            ws-gateway/junit.xml
            ws-gateway/coverage/lcov.info

  test-frontend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  # ---------------------------------------------------------------- Stage 3: BUILD
  build:
    needs: [test-agent, test-backend, test-ws-gateway, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ws-gateway/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build backend (jar)
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Build ws-gateway
        working-directory: ws-gateway
        run: |
          npm ci
          npm run build
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check agent code compiles
        working-directory: agent
        run: |
          pip install -r requirements.txt
          python -m compileall app
      - uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          retention-days: 7
          path: |
            backend/target/*.jar
            ws-gateway/dist

  # ---------------------------------------------------------------- Stage 4: PACKAGE
  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        service: [agent, backend, frontend, ws-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image monitor-${{ matrix.service }} (local only, not pushed)
        run: docker build -t "monitor-${{ matrix.service }}:${{ github.sha }}" "${{ matrix.service }}"
