name: CI - Application

# Application pipeline: tests, dependency scan, build, image scan, publish.
# It does NOT run for changes that only touch infra/ (those have their own pipeline: iac-ci.yml).
on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
  pull_request:
    paths-ignore:
      - "infra/**"
  workflow_dispatch:

# Least privilege: jobs can only read the repository content.
permissions:
  contents: read

env:
  # "false" = image scans only report, and nothing is published.
  # "true"  = image scans block the pipeline, and images that pass are published to ghcr.io (pushes to main only).
  IMG_GATE: "true"

# A new run on the same branch cancels the previous one. The workflow name is part of the key
# so this pipeline and the infrastructure pipeline never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------------- Stage 1: VALIDATE
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Required files are present
        run: |
          for svc in agent backend frontend ws-gateway; do
            test -f "$svc/Dockerfile" || { echo "::error::Missing Dockerfile: $svc"; exit 1; }
          done
          test -f docker-compose.yml || { echo "::error::Missing docker-compose.yml"; exit 1; }
          test -f .env.example || { echo "::error::Missing .env.example"; exit 1; }
      - name: No .env file is tracked by Git
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by Git"; exit 1
          fi
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q

  # ---------------------------------------------------------------- Stage 2: TEST
  test-agent:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt pytest-cov
      - name: Run tests
        working-directory: agent
        run: pytest --junitxml=junit-agent.xml --cov=. --cov-report=xml:coverage.xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-agent
          path: |
            agent/junit-agent.xml
            agent/coverage.xml

  test-backend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests with JaCoCo
        working-directory: backend
        run: mvn -B org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent test org.jacoco:jacoco-maven-plugin:0.8.12:report
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-backend
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/site/jacoco/jacoco.xml

  test-ws-gateway:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ws-gateway/package-lock.json
      - name: Install dependencies
        working-directory: ws-gateway
        run: |
          npm ci
          npm install --no-save @vitest/coverage-v8@2.1.9
      - name: Run tests
        working-directory: ws-gateway
        run: npx vitest run --reporter=junit --outputFile=junit.xml --coverage --coverage.provider=v8 --coverage.reporter=lcov
      - uses: actions/upload-artifact@v4
        with:
          name: test-reports-ws-gateway
          path: |
            ws-gateway/junit.xml
            ws-gateway/coverage/lcov.info

  test-frontend:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

  # ---------------------------------------------------------------- Stage 2b: SECURITY SCAN (application files)
  # skip-dirs: infra  ->  Terraform is scanned by the infrastructure pipeline, not here.
  security-scan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Trivy's own action was compromised in March 2026 (tags were rewritten).
      # So it is pinned to the full commit of the safe release 0.35.0, and the Trivy binary to v0.69.3.
      - name: Trivy report (all severities, never fails)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          skip-dirs: infra
          scanners: vuln,secret,misconfig
          format: table
          output: trivy-report.txt
          exit-code: "0"
      - name: Show the report in the log
        if: always()
        run: cat trivy-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report-${{ github.sha }}
          retention-days: 30
          path: trivy-report.txt

  # Separate job = fresh machine, so nothing left over from the report scan can change the result.
  security-gate:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Trivy gate (fails on CRITICAL, or HIGH with an available fix)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          skip-dirs: infra
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # ---------------------------------------------------------------- Stage 3: BUILD
  build:
    needs: [test-agent, test-backend, test-ws-gateway, test-frontend, security-scan, security-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ws-gateway/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build backend (jar)
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Build ws-gateway
        working-directory: ws-gateway
        run: |
          npm ci
          npm run build
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check agent code compiles
        working-directory: agent
        run: |
          pip install -r requirements.txt
          python -m compileall app
      - uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          retention-days: 7
          path: |
            backend/target/*.jar
            ws-gateway/dist

  # ---------------------------------------------------------------- Stage 4: PACKAGE (build and scan the images)
  package:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [agent, backend, frontend, ws-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image monitor-${{ matrix.service }} (local only)
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "monitor-${{ matrix.service }}:${{ github.sha }}" "${{ matrix.service }}"
      - name: Trivy image report (all severities, never fails)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: image
          image-ref: monitor-${{ matrix.service }}:${{ github.sha }}
          scanners: vuln,secret
          format: table
          output: trivy-image-${{ matrix.service }}.txt
          exit-code: "0"
      - name: Start of the report
        if: always()
        run: head -n 40 trivy-image-${{ matrix.service }}.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-image-report-${{ matrix.service }}-${{ github.sha }}
          retention-days: 30
          path: trivy-image-${{ matrix.service }}.txt
      - name: Trivy image gate (CRITICAL, or HIGH with an available fix)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          version: v0.69.3
          scan-type: image
          image-ref: monitor-${{ matrix.service }}:${{ github.sha }}
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore-images
          exit-code: ${{ env.IMG_GATE == 'true' && '1' || '0' }}
      - name: Save the scanned image
        if: env.IMG_GATE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "monitor-${{ matrix.service }}:${{ github.sha }}" -o "image-${{ matrix.service }}.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.IMG_GATE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: image-${{ matrix.service }}
          retention-days: 1
          path: image-${{ matrix.service }}.tar

  # ---------------------------------------------------------------- Stage 5: PUBLISH
  # Only the image that passed the gate is published (the same file, not a rebuild).
  # Runs on pushes to main only. This is the only job allowed to write to the registry.
  publish:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [agent, backend, frontend, ws-gateway]
    steps:
      - name: Publishing is off while IMG_GATE is not true
        if: env.IMG_GATE != 'true'
        run: echo "IMG_GATE is not true, nothing is published."
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.IMG_GATE == 'true'
        with:
          name: image-${{ matrix.service }}
      - name: Load, push by commit SHA, record the digest
        if: env.IMG_GATE == 'true'
        env:
          SERVICE: ${{ matrix.service }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/monitor-${SERVICE}"
          docker load -i "image-${SERVICE}.tar"
          echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker tag "monitor-${SERVICE}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")"
          echo "${DIGEST}" > "digest-${SERVICE}.txt"
          echo "- ${SERVICE}: \`${DIGEST}\`" >> "${GITHUB_STEP_SUMMARY}"
          docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.IMG_GATE == 'true'
        with:
          name: digest-${{ matrix.service }}-${{ github.sha }}
          retention-days: 90
          path: digest-${{ matrix.service }}.txt
